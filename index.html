<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achref Loussaief: projects</title>
<meta name="description" content="Projects by Achref Loussaief, with notes on what each one does.">
<meta name="theme-color" content="#22211d">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --paper: #22211d;
    --ink: #e6e3d6;
    --muted: #aeab9a;
    --orange: #ff9a52;
    --orange-hover: #ffbd8c;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: "IBM Plex Mono", Menlo, Consolas, monospace;
    font-size: 14px;
    line-height: 1.6;
  }
  a { color: var(--orange); }
  a:hover { color: var(--orange-hover); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .page { max-width: 50rem; margin: 0 auto; padding: 28px 16px 40px; }

  header {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    gap: 4px 16px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--orange);
  }
  h1 { margin: 0; font-size: 16px; font-weight: 600; color: var(--orange); }
  .here { color: var(--muted); }

  #projects { display: flex; flex-direction: column; gap: 36px; padding-top: 28px; }
  .status { margin: 28px 0 0; color: var(--muted); }
  .status:empty { display: none; }

  .project { display: grid; grid-template-columns: 2.5ch minmax(0, 1fr); gap: 0 1.5ch; }
  .rank { color: var(--muted); }
  h2 { margin: 0; font-size: 14px; font-weight: 600; line-height: 1.5; overflow-wrap: anywhere; }
  .facts { margin: 2px 0 0; font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
  .note { margin-top: 12px; }
  .note:empty { display: none; }
  .note p { margin: 0 0 12px; }
  .note > :last-child { margin-bottom: 0; }
  .note img { max-width: 100%; height: auto; }
  .note pre { overflow-x: auto; }

  .message p { margin: 0 0 8px; }
</style>
</head>
<body>

<!--
  ========================================================================
  WRITE YOUR PROJECT EXPLANATIONS HERE
  ========================================================================
  Your repos appear on the page automatically. This list is only for the
  words you want to add. Copy this block inside the template below, once
  per project, and use the repo name exactly as it appears on GitHub:

      <section data-repo="my-repo-name" data-tagline="one line on what it does">
        <p>What the project does and why you made it.</p>
        <p>What you learned, or what you'd like to add next.</p>
      </section>

  The tagline is optional. It appears after the repo name in the title.

  Projects you explain here appear first, in the order you write them.
  All the others follow, starting with the most recently updated.

  To hide a repo from the page, add this line instead:

      <section data-repo="my-repo-name" data-hide></section>
  ========================================================================
-->
<template id="project-notes">

  <section data-repo="k8s-ha-lab" data-tagline="a highly available Kubernetes cluster, from scratch">
    <p>A highly available Kubernetes cluster I built from scratch with kubeadm on 5 KVM virtual machines: 3 control planes with stacked etcd behind a floating kube-vip IP, 2 workers, and Cilium replacing kube-proxy. The whole lab is code, so Vagrant and three Ansible playbooks can rebuild it from nothing.</p>
    <p>I made it to practice what you only really learn on an HA cluster: losing a master, keeping etcd quorum, restoring from backups and upgrading without downtime. When I cut the power to the master holding the virtual IP, the API was unavailable for about 20 seconds and application traffic wasn't interrupted.</p>
    <p>The best lesson came from the etcd restore: the first run stopped halfway with the API down on all masters, because the runbook relied on a tool that wasn't installed on the nodes. Test your recovery runbooks before you need them.</p>
  </section>

</template>

<div class="page">
  <header>
    <!-- Edit your name here -->
    <h1>Achref Loussaief</h1>
    <span class="here">projects</span>
    <a href="https://github.com/Achref-LOUSSAIEF">github</a>
  </header>

  <main>
    <p class="status" id="status" aria-live="polite">Loading projects from GitHub…</p>
    <div id="projects"></div>
  </main>
</div>

<script>
  const USERNAME = "Achref-LOUSSAIEF";
  const PROFILE_URL = "https://github.com/" + USERNAME;
  const CACHE_KEY = "repos:" + USERNAME;
  const CACHE_LIFETIME = 60 * 60 * 1000; // GitHub limits how often a visitor can ask, so reuse answers for an hour

  const status = document.getElementById("status");
  const list = document.getElementById("projects");

  function el(tag, props, ...children) {
    const node = Object.assign(document.createElement(tag), props || {});
    node.append(...children);
    return node;
  }

  function monthYear(date) {
    return date.toLocaleDateString("en-US", { month: "short", year: "numeric" });
  }

  function readCache() {
    try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) { return null; }
  }

  function writeCache(repos) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), repos })); } catch (e) { /* the page works without it */ }
  }

  async function fetchRepos() {
    const repos = [];
    for (let page = 1; ; page++) {
      const response = await fetch(
        "https://api.github.com/users/" + USERNAME + "/repos?per_page=100&sort=pushed&page=" + page,
        { headers: { Accept: "application/vnd.github+json" } }
      );
      if (!response.ok) throw new Error("GitHub responded with " + response.status);
      const batch = await response.json();
      for (const r of batch) {
        repos.push({
          name: r.name,
          description: r.description,
          url: r.html_url,
          homepage: r.homepage,
          language: r.language,
          stars: r.stargazers_count,
          fork: r.fork,
          archived: r.archived,
          pushed: r.pushed_at
        });
      }
      if (batch.length < 100) return repos;
    }
  }

  async function loadRepos() {
    const cached = readCache();
    if (cached && Date.now() - cached.savedAt < CACHE_LIFETIME) return cached.repos;
    try {
      const repos = await fetchRepos();
      writeCache(repos);
      return repos;
    } catch (error) {
      if (cached) return cached.repos;
      throw error;
    }
  }

  function readNotes() {
    const notes = new Map();
    document.getElementById("project-notes").content.querySelectorAll("[data-repo]").forEach((section) => {
      notes.set(section.dataset.repo.trim().toLowerCase(), section);
    });
    return notes;
  }

  function isWebAddress(value) {
    return /^https?:\/\//i.test(value || "");
  }

  function renderProject(repo, note, position) {
    const hasWords = note && note.textContent.trim();
    const tagline = note && note.dataset.tagline ? note.dataset.tagline.trim() : "";
    const title = tagline ? repo.name + ": " + tagline : repo.name;

    // Facts are separated by " | ", and a link can be one of them
    const facts = el("p", { className: "facts" });
    const parts = [];
    if (repo.pushed) parts.push("updated " + monthYear(new Date(repo.pushed)));
    if (repo.language) parts.push(repo.language);
    if (repo.stars > 0) parts.push(repo.stars + (repo.stars === 1 ? " star" : " stars"));
    if (repo.archived) parts.push("archived");
    parts.push("github.com/" + USERNAME);
    if (isWebAddress(repo.homepage)) parts.push(el("a", { href: repo.homepage, textContent: "live site" }));
    parts.forEach((part, i) => facts.append(i ? " | " : "", part));

    const words = el("div", { className: "note" });
    if (hasWords) words.append(...Array.from(note.childNodes, (n) => n.cloneNode(true)));
    else if (repo.description) words.append(el("p", { textContent: repo.description }));

    return el("article", { className: "project" },
      el("span", { className: "rank", textContent: position + "." }),
      el("div", null,
        el("h2", null, el("a", { href: repo.url, textContent: title })),
        facts,
        words
      )
    );
  }

  function showFailure(notes) {
    status.textContent = "";
    list.append(el("div", { className: "message" },
      el("p", { textContent: "GitHub isn't sending the project list right now, usually because of too many requests in the last hour. Try again later, or browse the projects directly." }),
      el("p", null, el("a", { href: PROFILE_URL + "?tab=repositories", textContent: "See all projects on GitHub" }))
    ));
    let position = 1;
    notes.forEach((note) => {
      if (note.hasAttribute("data-hide")) return;
      const name = note.dataset.repo.trim();
      list.append(renderProject({ name, url: PROFILE_URL + "/" + name }, note, position++));
    });
  }

  async function start() {
    const notes = readNotes();
    let repos;
    try {
      repos = await loadRepos();
    } catch (error) {
      console.warn(error);
      showFailure(notes);
      return;
    }

    const ownSite = (USERNAME + ".github.io").toLowerCase();
    const visible = repos.filter((r) => {
      const key = r.name.toLowerCase();
      if (r.fork || key === ownSite) return false;
      const note = notes.get(key);
      return !(note && note.hasAttribute("data-hide"));
    });

    if (!visible.length) {
      status.textContent = "No public projects yet.";
      return;
    }

    const known = new Set(repos.map((r) => r.name.toLowerCase()));
    notes.forEach((note, key) => {
      if (!known.has(key)) console.warn('No public repo is called "' + note.dataset.repo + '". Check the name in your notes.');
    });

    const order = Array.from(notes.keys());
    const rank = (r) => {
      const i = order.indexOf(r.name.toLowerCase());
      return i === -1 ? order.length : i;
    };
    visible.sort((a, b) => rank(a) - rank(b) || new Date(b.pushed) - new Date(a.pushed));

    status.textContent = "";
    visible.forEach((repo, i) => list.append(renderProject(repo, notes.get(repo.name.toLowerCase()), i + 1)));
  }

  start();
</script>
</body>
</html>
