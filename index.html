<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Achref Loussaief: projects</title>
<meta name="description" content="Projects by Achref Loussaief, with notes on what each one does.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light dark;
    --paper: #E8EEF1;
    --ink: #12263A;
    --muted: #4A5D70;
    --line: #C3D0DA;
    --bar: #1F5FBF;
    --link: #1A4FA8;
    --latest: #D9480F;
    --display: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
    --reading: "Newsreader", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #12263A;
      --ink: #E8EEF1;
      --muted: #A9BBCB;
      --line: #2F4660;
      --bar: #7FB0FF;
      --link: #A5C8FF;
      --latest: #FF9A5C;
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--display);
    font-size: 1rem;
    line-height: 1.5;
  }
  a { color: var(--link); text-underline-offset: .18em; }
  a:hover { text-decoration-thickness: 2px; }
  :focus-visible { outline: 3px solid var(--latest); outline-offset: 3px; border-radius: 2px; }

  .page { max-width: 75rem; margin: 0 auto; padding: 0 clamp(1rem, 4vw, 3rem); }

  /* Opening */
  .intro { padding: clamp(3rem, 9vw, 7rem) 0 clamp(2.5rem, 6vw, 4.5rem); }
  h1 {
    margin: 0 0 clamp(1.5rem, 4vw, 2.5rem);
    font-size: clamp(3.5rem, 13.5vw, 11.5rem);
    font-weight: 700;
    line-height: .88;
    letter-spacing: -.025em;
  }
  h1 span { display: block; }
  .lede {
    max-width: 34em;
    margin: 0 0 .75rem;
    font-family: var(--reading);
    font-size: clamp(1.3rem, 2.4vw, 1.7rem);
    line-height: 1.35;
  }
  .summary { margin: 0; color: var(--muted); }

  /* Shared timeline */
  .axis {
    position: sticky;
    top: 0;
    z-index: 2;
    height: 2.25rem;
    background: var(--paper);
    border-bottom: 1px solid var(--ink);
    color: var(--muted);
    font-size: .875rem;
  }
  .axis span { position: absolute; bottom: .35rem; font-variant-numeric: tabular-nums; }
  .axis-title { margin: 0 0 .5rem; font-size: .9375rem; color: var(--muted); }

  /* A project */
  .project { padding-top: clamp(1.75rem, 4vw, 2.75rem); }
  .project-body {
    display: grid;
    grid-template-columns: minmax(0, 5fr) minmax(0, 7fr);
    gap: 1rem clamp(1.5rem, 5vw, 4rem);
    align-items: start;
    margin-bottom: clamp(1.25rem, 3vw, 1.75rem);
  }
  h2 {
    margin: 0 0 .5rem;
    font-size: clamp(1.5rem, 3vw, 2.25rem);
    font-weight: 700;
    line-height: 1.08;
    letter-spacing: -.02em;
    overflow-wrap: anywhere;
  }
  h2 a { color: inherit; text-decoration: none; }
  h2 a:hover { color: var(--link); text-decoration: underline; text-decoration-thickness: 2px; }
  .facts {
    display: flex;
    flex-wrap: wrap;
    gap: .15rem 1rem;
    margin: 0;
    padding: 0;
    list-style: none;
    color: var(--muted);
    font-size: .9375rem;
  }
  .note {
    max-width: 62ch;
    font-family: var(--reading);
    font-size: 1.1875rem;
    line-height: 1.55;
  }
  .note > :first-child { margin-top: 0; }
  .note > :last-child { margin-bottom: 0; }
  .note img { max-width: 100%; height: auto; }

  /* The project's lifespan, drawn on the shared timeline */
  .track { position: relative; height: 1.125rem; border-bottom: 1px solid var(--line); }
  .tick { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
  .span {
    position: absolute;
    top: .25rem;
    height: .5rem;
    min-width: .5rem;
    border-radius: .25rem;
    background: var(--bar);
    transform-origin: left center;
    animation: draw .9s cubic-bezier(.2, .7, .2, 1) both;
  }
  .span::after {
    content: "";
    position: absolute;
    right: -.0625rem;
    top: -.125rem;
    width: .75rem;
    height: .75rem;
    border-radius: 50%;
    background: var(--latest);
    border: 2px solid var(--paper);
  }
  @keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }
  @media (prefers-reduced-motion: reduce) { .span { animation: none; } }

  .message { max-width: 38em; padding: 2rem 0; }
  .message p { margin: 0 0 .5rem; }

  footer { padding: clamp(3rem, 7vw, 5rem) 0 2.5rem; color: var(--muted); }
  footer p { margin: 0; }

  @media (max-width: 44rem) {
    .project-body { grid-template-columns: minmax(0, 1fr); }
    .note { font-size: 1.125rem; }
  }
</style>
</head>
<body>

<!--
  ========================================================================
  WRITE YOUR PROJECT EXPLANATIONS HERE
  ========================================================================
  Your repos appear on the page automatically. This list is only for the
  words you want to add. Copy this block inside the template below, once
  per project, and use the repo name exactly as it appears on GitHub:

      <section data-repo="my-repo-name">
        <p>What the project does and why you made it.</p>
        <p>What you learned, or what you'd like to add next.</p>
      </section>

  Projects you explain here appear first, in the order you write them.
  All the others follow, starting with the most recently updated.

  To hide a repo from the page, add this line instead:

      <section data-repo="my-repo-name" data-hide></section>
  ========================================================================
-->
<template id="project-notes">

</template>

<div class="page">
  <header class="intro">
    <!-- Edit your name and introduction here -->
    <h1><span>Achref</span><span>Loussaief</span></h1>
    <p class="lede">Projects I've built, with a few words on what each one does and why I made it.</p>
    <p class="summary" id="summary" aria-live="polite">Loading projects from GitHub…</p>
  </header>

  <main>
    <div id="timeline" hidden>
      <p class="axis-title">Each line runs from the day a project started to its last update, shown by the dot.</p>
      <div class="axis" id="axis" aria-hidden="true"></div>
    </div>
    <div id="projects"></div>
  </main>

  <footer>
    <p>See all of my code on <a href="https://github.com/Achref-LOUSSAIEF">GitHub</a>.</p>
  </footer>
</div>

<script>
  const USERNAME = "Achref-LOUSSAIEF";
  const PROFILE_URL = "https://github.com/" + USERNAME;
  const CACHE_KEY = "repos:" + USERNAME;
  const CACHE_LIFETIME = 60 * 60 * 1000; // GitHub limits how often a visitor can ask, so reuse answers for an hour

  const summary = document.getElementById("summary");
  const list = document.getElementById("projects");

  function el(tag, props, ...children) {
    const node = Object.assign(document.createElement(tag), props || {});
    node.append(...children);
    return node;
  }

  function monthYear(date) {
    return date.toLocaleDateString("en-GB", { month: "short", year: "numeric" });
  }

  function readCache() {
    try { return JSON.parse(localStorage.getItem(CACHE_KEY)); } catch (e) { return null; }
  }

  function writeCache(repos) {
    try { localStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), repos })); } catch (e) { /* the page works without it */ }
  }

  async function fetchRepos() {
    const repos = [];
    for (let page = 1; ; page++) {
      const response = await fetch(
        "https://api.github.com/users/" + USERNAME + "/repos?per_page=100&sort=pushed&page=" + page,
        { headers: { Accept: "application/vnd.github+json" } }
      );
      if (!response.ok) throw new Error("GitHub responded with " + response.status);
      const batch = await response.json();
      for (const r of batch) {
        repos.push({
          name: r.name,
          description: r.description,
          url: r.html_url,
          homepage: r.homepage,
          language: r.language,
          stars: r.stargazers_count,
          fork: r.fork,
          archived: r.archived,
          created: r.created_at,
          pushed: r.pushed_at
        });
      }
      if (batch.length < 100) return repos;
    }
  }

  async function loadRepos() {
    const cached = readCache();
    if (cached && Date.now() - cached.savedAt < CACHE_LIFETIME) return cached.repos;
    try {
      const repos = await fetchRepos();
      writeCache(repos);
      return repos;
    } catch (error) {
      if (cached) return cached.repos;
      throw error;
    }
  }

  function readNotes() {
    const notes = new Map();
    document.getElementById("project-notes").content.querySelectorAll("[data-repo]").forEach((section) => {
      notes.set(section.dataset.repo.trim().toLowerCase(), section);
    });
    return notes;
  }

  function isWebAddress(value) {
    return /^https?:\/\//i.test(value || "");
  }

  function renderProject(repo, note, range) {
    const facts = el("ul", { className: "facts" });
    const addFact = (...content) => facts.append(el("li", null, ...content));
    if (repo.language) addFact(repo.language);
    if (repo.stars > 0) addFact(repo.stars + (repo.stars === 1 ? " star" : " stars"));
    if (repo.pushed) addFact("Updated " + monthYear(new Date(repo.pushed)));
    if (repo.archived) addFact("Archived");
    if (isWebAddress(repo.homepage)) addFact(el("a", { href: repo.homepage, textContent: "Open live site" }));

    const words = el("div", { className: "note" });
    if (note && note.textContent.trim()) words.append(...Array.from(note.childNodes, (n) => n.cloneNode(true)));
    else if (repo.description) words.append(el("p", { textContent: repo.description }));

    const article = el("article", { className: "project" },
      el("div", { className: "project-body" },
        el("div", null,
          el("h2", null, el("a", { href: repo.url, textContent: repo.name })),
          facts
        ),
        words
      )
    );

    if (range && repo.created && repo.pushed) {
      const start = new Date(repo.created);
      const end = new Date(repo.pushed);
      const track = el("div", { className: "track", role: "img" });
      track.setAttribute("aria-label", "Started " + monthYear(start) + ", last updated " + monthYear(end));
      range.years.forEach((y) => {
        const tick = el("div", { className: "tick" });
        tick.style.left = y.left + "%";
        track.append(tick);
      });
      const span = el("div", { className: "span" });
      span.style.left = range.position(start) + "%";
      span.style.width = Math.max(0, range.position(end) - range.position(start)) + "%";
      track.append(span);
      article.append(track);
    }
    return article;
  }

  function buildRange(repos) {
    const starts = repos.map((r) => new Date(r.created).getTime());
    const firstYear = new Date(Math.min(...starts)).getFullYear();
    const from = new Date(firstYear, 0, 1).getTime();
    const to = Date.now();
    const position = (date) => Math.min(100, Math.max(0, ((date.getTime() - from) / (to - from)) * 100));
    const years = [];
    for (let y = firstYear; y <= new Date(to).getFullYear(); y++) {
      years.push({ year: y, left: position(new Date(y, 0, 1)) });
    }
    return { years, position, firstYear };
  }

  function renderAxis(range) {
    const axis = document.getElementById("axis");
    const step = Math.ceil(range.years.length / 7);
    range.years.forEach((y, i) => {
      if (i % step !== 0 || y.left > 93) return;
      const label = el("span", { textContent: y.year });
      label.style.left = y.left + "%";
      axis.append(label);
    });
    document.getElementById("timeline").hidden = false;
  }

  function showFailure(notes) {
    summary.textContent = "";
    const message = el("div", { className: "message" },
      el("p", { textContent: "GitHub isn't sending the project list right now, usually because of too many requests in the last hour. Try again later, or browse the projects directly." }),
      el("p", null, el("a", { href: PROFILE_URL + "?tab=repositories", textContent: "See all projects on GitHub" }))
    );
    list.append(message);
    notes.forEach((note, key) => {
      if (note.hasAttribute("data-hide")) return;
      const name = note.dataset.repo.trim();
      list.append(renderProject({ name, url: PROFILE_URL + "/" + name }, note, null));
    });
  }

  async function start() {
    const notes = readNotes();
    let repos;
    try {
      repos = await loadRepos();
    } catch (error) {
      console.warn(error);
      showFailure(notes);
      return;
    }

    const ownSite = (USERNAME + ".github.io").toLowerCase();
    const visible = repos.filter((r) => {
      const key = r.name.toLowerCase();
      if (r.fork || key === ownSite) return false;
      const note = notes.get(key);
      return !(note && note.hasAttribute("data-hide"));
    });

    if (!visible.length) {
      summary.textContent = "No public projects yet.";
      return;
    }

    const known = new Set(repos.map((r) => r.name.toLowerCase()));
    notes.forEach((note, key) => {
      if (!known.has(key)) console.warn('No public repo is called "' + note.dataset.repo + '". Check the name in your notes.');
    });

    const order = Array.from(notes.keys());
    const rank = (r) => {
      const i = order.indexOf(r.name.toLowerCase());
      return i === -1 ? order.length : i;
    };
    visible.sort((a, b) => rank(a) - rank(b) || new Date(b.pushed) - new Date(a.pushed));

    const range = buildRange(visible);
    summary.textContent = visible.length + (visible.length === 1 ? " public project" : " public projects") + " on GitHub since " + range.firstYear + ".";
    renderAxis(range);
    visible.forEach((repo) => list.append(renderProject(repo, notes.get(repo.name.toLowerCase()), range)));
  }

  start();
</script>
</body>
</html>
